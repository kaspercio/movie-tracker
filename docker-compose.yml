version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: your_password_here
      POSTGRES_DB: movie_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    ports: 
      - "8000:8000"
    env_file:
      - .env  
    environment:
      DATABASE_URL: postgresql://movie_user:your_password_here@postgres:5432/movie_tracker
    depends_on:
      - postgres

volumes:
  postgres_data: